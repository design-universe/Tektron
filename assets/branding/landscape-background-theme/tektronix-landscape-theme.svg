<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Tektronix LLC brand landscape background theme. Brand colors: #024141 (deep teal), #47BCA0 (mint accent), #FFFFFF (white). -->
  <defs>
    <radialGradient id="baseGlow" cx="72%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#0a5f5a"/>
      <stop offset="35%" stop-color="#053f3c"/>
      <stop offset="70%" stop-color="#022f2d"/>
      <stop offset="100%" stop-color="#011a19"/>
    </radialGradient>

    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a5f58"/>
      <stop offset="100%" stop-color="#023635"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c6e63"/>
      <stop offset="100%" stop-color="#02302e"/>
    </linearGradient>
    <linearGradient id="wave3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f9483"/>
      <stop offset="100%" stop-color="#023735"/>
    </linearGradient>

    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#8fe4cf" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#47BCA0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#47BCA0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="softOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#47BCA0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#47BCA0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="46%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="72%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#001311" stop-opacity="0.55"/>
    </radialGradient>

    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blurWide" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blurNode" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M 96 0 L 0 0 0 96" fill="none" stroke="#47BCA0" stroke-width="1" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1920" height="1080" fill="url(#baseGlow)"/>

  <!-- faint technical grid -->
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- ambient soft orb, unified with hero node, dynamic focal accent -->
  <circle cx="1640" cy="360" r="480" fill="url(#softOrb)" filter="url(#blurWide)"/>

  <!-- faint constellation particles, sparse depth in the open sky -->
  <g fill="#FFFFFF">
    <circle cx="240" cy="180" r="1.3" opacity="0.35"/>
    <circle cx="520" cy="330" r="1" opacity="0.25"/>
    <circle cx="980" cy="150" r="1.4" opacity="0.3"/>
    <circle cx="1180" cy="300" r="1" opacity="0.22"/>
    <circle cx="1380" cy="200" r="1.2" opacity="0.3"/>
    <circle cx="820" cy="480" r="1" opacity="0.2"/>
  </g>

  <!-- thin diagonal trajectory lines converging on the hero node -->
  <g opacity="0.38" stroke="#47BCA0" stroke-width="1.4">
    <line x1="-60" y1="1010" x2="1706" y2="462"/>
  </g>
  <g opacity="0.2" stroke="#FFFFFF" stroke-width="1">
    <line x1="140" y1="1080" x2="1706" y2="462"/>
  </g>

  <!-- layered horizon waves: distant to near -->
  <path d="M0,760 C280,700 620,742 960,712 C1300,682 1600,730 1920,690 L1920,1080 L0,1080 Z"
        fill="url(#wave1)" opacity="0.55" filter="url(#blurSoft)"/>
  <path d="M0,840 C340,792 700,822 960,796 C1250,770 1560,812 1920,782 L1920,1080 L0,1080 Z"
        fill="url(#wave2)" opacity="0.72"/>
  <path d="M0,928 C400,888 760,908 1010,892 C1360,872 1660,902 1920,876 L1920,1080 L0,1080 Z"
        fill="url(#wave3)" opacity="0.85"/>
  <path d="M0,928 C400,888 760,908 1010,892 C1360,872 1660,902 1920,876"
        fill="none" stroke="#7fd9c4" stroke-width="1.4" opacity="0.4"/>

  <!-- constellation / network motif -->
  <g stroke="#47BCA0" stroke-width="1.1" opacity="0.5">
    <line x1="120" y1="860" x2="266" y2="820"/>
    <line x1="266" y1="820" x2="414" y2="846"/>
    <line x1="414" y1="846" x2="592" y2="810"/>
    <line x1="592" y1="810" x2="762" y2="832"/>
    <line x1="762" y1="832" x2="942" y2="800"/>
    <line x1="942" y1="800" x2="1122" y2="816"/>
    <line x1="1122" y1="816" x2="1302" y2="788"/>
    <line x1="1302" y1="788" x2="1482" y2="806"/>
    <line x1="1482" y1="806" x2="1652" y2="768"/>
    <line x1="1652" y1="768" x2="1804" y2="792"/>
    <line x1="1652" y1="768" x2="1624" y2="648"/>
    <line x1="1624" y1="648" x2="1706" y2="462"/>
    <line x1="1706" y1="462" x2="1782" y2="620"/>
    <line x1="1482" y1="806" x2="1556" y2="562"/>
  </g>
  <g fill="#47BCA0">
    <circle cx="120" cy="860" r="4"/>
    <circle cx="266" cy="820" r="3.2"/>
    <circle cx="414" cy="846" r="4"/>
    <circle cx="592" cy="810" r="3.2"/>
    <circle cx="762" cy="832" r="4"/>
    <circle cx="942" cy="800" r="3.2"/>
    <circle cx="1122" cy="816" r="4"/>
    <circle cx="1302" cy="788" r="3.2"/>
    <circle cx="1482" cy="806" r="4.2"/>
    <circle cx="1652" cy="768" r="4.6"/>
    <circle cx="1804" cy="792" r="3.2"/>
    <circle cx="1624" cy="648" r="4"/>
    <circle cx="1782" cy="620" r="3.6"/>
    <circle cx="1556" cy="562" r="3.6"/>
  </g>
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="1652" cy="768" r="1.6"/>
    <circle cx="1122" cy="816" r="1.4"/>
    <circle cx="592" cy="810" r="1.4"/>
  </g>

  <!-- hero node: AI core -->
  <circle cx="1706" cy="462" r="70" fill="url(#heroGlow)" filter="url(#blurNode)"/>
  <circle cx="1706" cy="462" r="6.5" fill="#FFFFFF"/>
  <circle cx="1706" cy="462" r="14" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.55"/>
  <circle cx="1706" cy="462" r="24" fill="none" stroke="#47BCA0" stroke-width="1" opacity="0.4"/>

  <!-- vignette for depth -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
